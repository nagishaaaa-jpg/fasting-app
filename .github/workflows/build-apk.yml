name: Build Android APK
​on:
workflow_dispatch:
push:
branches:
- main
paths:
- '.github/workflows/build-apk.yml'
- 'index.html'
​jobs:
build-apk:
runs-on: ubuntu-latest
​steps:
- name: リポジトリのコードを取得
uses: actions/checkout@v4
​- name: Node.jsのセットアップ
uses: actions/setup-node@v4
with:
node-version: 18
​- name: Java (JDK 17) のセットアップ
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Android SDKのセットアップ
uses: android-actions/setup-android@v3
​- name: Android SDKライセンスへの自動同意
run: |
yes | sdkmanager --licenses || true
​- name: Cordovaプロジェクトの作成とビルド
run: |
npm install -g cordova
cordova create fasting-app com.akito.fastingapp "AKITO断食"
cd fasting-app
rm -rf www/*
cp ../index.html www/index.html
cordova platform add android
cordova build android --debug
​- name: 完成したAPKファイルを保存
uses: actions/upload-artifact@v4
with:
name: akito-fasting-app
path: fasting-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
