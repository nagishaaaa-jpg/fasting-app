name: Build Android APK
​on:
workflow_dispatch: # ボタンを押して手動でいつでも作成可能
push:
branches:
- main # mainブランチに更新があったとき自動で作成
​jobs:
build-apk:
runs-on: ubuntu-latest
​steps:
- name: リポジトリのコードを取得
uses: actions/checkout@v4
​- name: Node.jsのセットアップ
uses: actions/setup-node@v4
with:
node-version: 20
​- name: Java (JDK 17) のセットアップ
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'
​- name: Android SDKのセットアップ
uses: android-actions/setup-android@v3
​- name: Capacitorプロジェクトの自動初期化と組み立て
run: |
mkdir app-builder
cd app-builder
npm init -y
npm install @capacitor/core @capacitor/cli @capacitor/android
npx cap init "AKITO断食" "com.akito.fastingapp" --web-dir ../
npx cap add android
npx cap sync android
​- name: Android APKのビルド
run: |
cd app-builder/android
chmod +x gradlew
./gradlew assembleDebug
​- name: 完成したAPKファイルを保存
uses: actions/upload-artifact@v4
with:
name: akito-fasting-app
path: app-builder/android/app/build/outputs/apk/debug/app-debug.apk
